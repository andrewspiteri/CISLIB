name: CISLIB service tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cislib-service-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  service-tests:
    name: PostgreSQL and RabbitMQ integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: implementations/csharp
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      MSBUILDDISABLENODEREUSE: "1"
      UseSharedCompilation: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select owned tool paths
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/cislib-dotnet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOTNET_CLI_HOME=%s/cislib-cli\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install pinned Management client runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          check-latest: false
          package-manager-cache: false

      - name: Build and check portable Management clients
        working-directory: implementations/typescript
        timeout-minutes: 4
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/cislib-management-npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.16.0"
          printf 'CIS_TEST_NODE_EXECUTABLE=%s\n' "$(node -p 'process.execPath')" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/cislib-npm" \
            --ignore-scripts --no-audit --no-fund --no-save --package-lock=false npm@11.12.1
          npm_cli="$RUNNER_TEMP/cislib-npm/node_modules/npm/bin/npm-cli.js"
          test "$(node "$npm_cli" --version)" = "11.12.1"
          node "$npm_cli" ci --ignore-scripts --no-audit --no-fund
          node "$npm_cli" run build
          node "$npm_cli" test
          node "$npm_cli" run check:browser

      - name: Prepare production portal and headed browser
        working-directory: implementations/typescript
        timeout-minutes: 4
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/cislib-management-npm
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          edge=/opt/microsoft/msedge/msedge
          if [ ! -x "$edge" ]; then
            printf 'The ubuntu-24.04 runner must provide Microsoft Edge at %s.\n' "$edge" >&2
            exit 1
          fi
          for tool in Xvfb xvfb-run xauth; do
            if ! command -v "$tool" > /dev/null; then
              printf 'Required headed portal browser prerequisite is missing: %s\n' "$tool" >&2
              exit 1
            fi
          done
          "$edge" --version
          dpkg-query --show --showformat='${binary:Package} ${Version}\n' xvfb xauth
          npm_cli="$RUNNER_TEMP/cislib-npm/node_modules/npm/bin/npm-cli.js"
          node "$npm_cli" run build --workspace @cislib/management-portal
          test -s applications/management-portal/.next/BUILD_ID

      - name: Install pinned SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.401"
          architecture: x64
          check-latest: false
          skip-lts-prepass: true
          cache: false

      - name: Verify selected runtimes and Docker
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.401"
          installer="$RUNNER_TEMP/cislib-dotnet-install.sh"
          for runtime in dotnet aspnetcore; do
            framework="Microsoft.NETCore.App"
            if [ "$runtime" = "aspnetcore" ]; then framework="Microsoft.AspNetCore.App"; fi
            if ! dotnet --list-runtimes | grep -F "$framework 10.0.12 [" > /dev/null; then
              if [ ! -f "$installer" ]; then
                curl --fail --silent --show-error --location --max-time 60 https://dot.net/v1/dotnet-install.sh --output "$installer"
              fi
              bash "$installer" --runtime "$runtime" --version 10.0.12 --architecture x64 --install-dir "$DOTNET_INSTALL_DIR" --skip-non-versioned-files --no-path
            fi
            dotnet --list-runtimes | grep -F "$framework 10.0.12 ["
          done
          docker_profile="$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')"
          test "$docker_profile" = "linux/amd64"
          printf 'Docker profile: %s\n' "$docker_profile"

      - name: Locked restore
        timeout-minutes: 8
        run: dotnet restore CisLib.slnx --locked-mode

      - name: Build
        timeout-minutes: 8
        run: dotnet build CisLib.slnx -c Release --no-restore

      - name: Run and verify selected services
        timeout-minutes: 22
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/cislib-service-results"
          mkdir -p "$results"
          set +e
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1200x24 -nolisten tcp' dotnet test tests/CIS.Core.IntegrationTests/CIS.Core.IntegrationTests.csproj -c Release --no-build --no-restore --settings tests/CIS.Core.IntegrationTests/service-tests.runsettings --filter "(TestCategory=RequiresDocker|TestCategory=RequiresNode)&TestCategory!=PerformanceObservation&TestCategory!=ExtendedStress" --logger "trx;LogFileName=service-tests.trx" --results-directory "$results"
          service_exit=$?
          set -e
          dotnet run --file eng/VerifyServiceTestReport.cs --artifacts-path "$RUNNER_TEMP/cislib-service-guard" -- "$results/service-tests.trx" "$service_exit"

      - name: Retain service result and capped fixture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cislib-service-tests
          path: ${{ runner.temp }}/cislib-service-results/service-tests.trx
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false
